<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>movelooper docs</title>
  <meta name="description" content="Guides and reference for movelooper, a CLI that sorts your files by rules you write in YAML.">
  <link rel="icon" href="../icons/movelooper_icon_on_dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="docs.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img class="logo-dark" src="../icons/movelooper_horizontal_on_dark.png" alt="movelooper">' +
        '<img class="logo-light" src="../icons/movelooper_horizontal_on_light.png" alt="movelooper">',
      nameLink: "../",
      repo: "lucasassuncao/movelooper",
      basePath: "../",
      homepage: "README.md",
      loadSidebar: true,
      subMaxLevel: 2,
      relativePath: true,
      search: { placeholder: "Search the docs", noData: "Nothing found", depth: 3 },
      copyCode: { buttonText: "copy", successText: "copied" }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <!-- language components register on docsify's own Prism instance -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Repository hygiene, which is platform-independent and only worth doing once:
  # formatting, generated docs, and dependency tidiness. The git-diff comparisons
  # these rely on would only produce line-ending noise on Windows.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check dependencies
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo ""
            echo "❌ go.mod or go.sum is out of date. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
          echo "✅ Dependencies are up to date."

      - name: Check formatting
        run: |
          make fmt
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Code is not formatted. Run 'make fmt' locally and commit the result."
            exit 1
          fi
          echo "✅ Code is properly formatted."

      - name: Check docs
        run: |
          make docs
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Documentation is out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi
          echo "✅ Documentation is up to date."

  # movelooper moves files, and the rules for doing that safely differ per
  # platform: cross-device renames, path semantics, file locking, and symlink
  # privileges.
  #
  # Lint and security run here, inside the matrix, rather than once on Linux.
  # Go only compiles the files that match the target platform, so a Linux-only
  # analysis never even sees lockfile_windows.go or lockfile_unix.go — the
  # per-OS files are exactly where platform bugs hide.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Test
        run: make test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn

  # The SBOM and the vulnerability scan describe the dependency graph, which
  # comes from go.mod and is the same everywhere. So this stays out of the OS
  # matrix, unlike lint and security: three runners would build the same SBOM
  # and download the vulnerability database three times to reach one answer.
  #
  # It is also its own job rather than a step inside Checks, because it fails
  # differently. A red mark here usually means a CVE was published against a
  # dependency, not that the commit broke something - the job can go red with
  # nothing in the repo having changed.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # syft and grype are built from source by the Makefile, which is slow for
      # a scan that takes seconds. The install rules have no prerequisites, so a
      # restored .gobin is enough for make to skip the build; the key follows
      # the Makefile because that is where the versions are pinned.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Scan dependencies
        run: make vuln

      # Uploaded even when the scan fails: the SBOM is written before grype
      # runs, and it is what you need to triage the findings.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

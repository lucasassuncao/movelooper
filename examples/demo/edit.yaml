configuration:
  logging:
    output: console
    level: info
categories:
  - name: images
    enabled: true
    source:
      path: ./Downloads
      extensions: [jpg, png]
    destination:
      path: ./Pictures
      organize-by: "{mod-year}/{mod-month}"
      conflict-strategy: hash_check
  - name: documents
    enabled: true
    source:
      path: ./Downloads
      extensions: [pdf]
      filter:
        not:
          - match:
              glob: "draft_*"
    destination:
      path: ./Documents
      rename: "{mod-date}_{name}.{ext}"
      conflict-strategy: rename
